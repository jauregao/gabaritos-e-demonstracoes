<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  
  <form action="/enviar">
    <fieldset>
      <legend>Dados Pessoais</legend>
          <label for="name">Nome:</label>
          <input type="text" name="name" id="name">
          <br><br>
          <label for="adress">Endereço:</label>
          <input type="text" name="adress" id="adress">
          <br><br>
          <label for="city">Cidade:</label>
          <input type="text" name="city" id="city">
          <br><br>
          <label for="estate">Estado:</label>
          <select name="estate" id="estate">
            <option value="RJ">Rio de Janeiro</option>
            <option value="RO">Rondônia</option>
          </select>
    </fieldset>
   <br><br>

    <fieldset>
      <legend>Dados profissionais</legend>
      <p>Natureza do cargo</p>
        <input type="radio" name="cargo" id="gerencia" value="Gerencia"><label for="gerencia">Gerência</label>
        <input type="radio" name="cargo" id="financeiro" value="Gerencia"><label for="financeiro">Financeiro</label>
    
        <p>Área de interesse</p>
        <input type="checkbox" name="interesse" id="comp"><label for="comp">Computação</label>
        <input type="checkbox" name="interesse" id=""><label for="bio">Biologia</label>
        <input type="checkbox" name="interesse" id="amb"><label for="amb">Meio Ambiente</label>
         <br><br>
        <label for="curriculo">Currículo:</label>
        <textarea name="curriculo" id="curriculo"></textarea>
    </fieldset>

     <br><br>
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
  </form>

</body>
</html>
