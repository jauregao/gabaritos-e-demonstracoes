<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Layout Flex</title>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="container container-header">
      <div class="circle header-logo"></div>
      <div class="line header-bar"></div>
      <div class="circles" id="circles-container">
        <div class="circle circle-menu"></div>
        <div class="circle circle-menu"></div>
        <div class="circle circle-menu"></div>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main>
    <div class="container">
      <div id="title-block" class="line"></div>

      <div class="content">
        <div id="content-left"></div>

        <div id="content-right">
          <div class="flex">
            <div class="content-block" id="content-block-1"></div>
            <div class="content-texts">
              <div class="text-line line"></div>
              <div class="text-line line"></div>
              <div class="text-line line"></div>
              <div class="text-line line"></div>
              <div class="text-line line"></div>
              <div class="text-line line"></div>
            </div>
          </div>

          <div class="line separator"></div>

          <div class="flex">
            <div class="content-block" id="content-block-2"></div>
            <div class="content-texts" id="content-text-2">
              <div class="text-line line"></div>
              <div class="text-line line"></div>
              <div class="text-line line"></div>
              <div class="text-line line"></div>
              <div class="text-line line"></div>
              <div class="text-line line"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
